<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USE ELLBA | Catálogo</title>
<meta name="description" content="Catálogo USE ELLBA: moda feminina. Escolha suas peças e finalize pelo WhatsApp.">
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<meta name="theme-color" content="#4a151b">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bordo:#4a151b; --bordo2:#5e1c24; --dourado:#dcb881; --dourado2:#b98f4f; --bg:#f8f5f2; --ink:#2b1a1c; --muted:#7d6e70; --linha:#eadfd6; --verde:#1f9d55; --raio:16px; --sombra:0 1px 2px rgba(74,21,27,.06),0 8px 24px rgba(74,21,27,.08); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
  body.travado { overflow:hidden; }
  button { font:inherit; cursor:pointer; border:0; background:none; color:inherit; }
  img { display:block; }
  .oculto { display:none !important; }

  header.topo { position:sticky; top:0; z-index:30; background:linear-gradient(180deg,var(--bordo2),var(--bordo)); padding:calc(10px + env(safe-area-inset-top)) 14px 10px; box-shadow:0 2px 14px rgba(0,0,0,.18); }
  .topo-linha { display:flex; align-items:center; justify-content:center; gap:10px; max-width:1100px; margin:0 auto; }
  .topo-linha img { width:38px; height:38px; border-radius:50%; }
  .marca { font-family:Georgia,serif; color:var(--dourado); letter-spacing:3px; font-weight:700; font-size:1.2rem; }

  .barra-busca { max-width:1100px; margin:12px auto 0; padding:0 14px; }
  .campo-busca { position:relative; }
  .campo-busca input { width:100%; padding:13px 16px 13px 44px; border:1.5px solid var(--linha); border-radius:14px; font-size:16px; background:#fff; color:var(--ink); outline:none; }
  .campo-busca input:focus { border-color:var(--bordo); box-shadow:0 0 0 .2rem rgba(74,21,27,.12); }
  .campo-busca svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:1.8; }

  .pilulas { display:flex; gap:8px; overflow-x:auto; padding:12px 14px 4px; max-width:1100px; margin:0 auto; scrollbar-width:none; }
  .pilulas::-webkit-scrollbar { display:none; }
  .pilula { flex:none; padding:9px 16px; border-radius:999px; background:#fff; border:1.5px solid var(--linha); color:var(--bordo); font-weight:600; font-size:.9rem; white-space:nowrap; }
  .pilula.ativa { background:var(--bordo); color:var(--dourado); border-color:var(--bordo); }
  .rotulo-linha { max-width:1100px; margin:6px auto 0; padding:0 18px; font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }

  .contagem { max-width:1100px; margin:10px auto 0; padding:0 18px; color:var(--muted); font-size:.85rem; }
  .grade { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:12px 14px 24px; max-width:1100px; margin:0 auto; }
  @media (min-width:700px) { .grade { grid-template-columns:repeat(3,1fr); gap:18px; } }
  @media (min-width:1000px) { .grade { grid-template-columns:repeat(4,1fr); } }
  .cartao { background:#fff; border-radius:var(--raio); overflow:hidden; box-shadow:var(--sombra); text-align:left; display:flex; flex-direction:column; }
  .cartao .foto { aspect-ratio:3/4; background:#efe6e0 center/cover no-repeat; position:relative; }
  .cartao .foto img { width:100%; height:100%; object-fit:cover; }
  .selo { position:absolute; left:8px; top:8px; background:var(--bordo); color:var(--dourado); font-size:.7rem; font-weight:700; padding:4px 9px; border-radius:999px; }
  .cartao .info { padding:10px 12px 13px; }
  .cartao .nome { font-size:.92rem; font-weight:600; line-height:1.25; color:var(--ink); min-height:2.3em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .cartao .preco { margin-top:4px; font-weight:800; color:var(--bordo); font-size:1.02rem; }
  .bolinhas { display:flex; gap:5px; margin-top:7px; align-items:center; flex-wrap:wrap; }
  .bolinhas small { color:var(--muted); font-size:.75rem; }
  .bolinha { width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.18); }

  .vazio, .erro { text-align:center; color:var(--muted); padding:40px 24px; }
  .erro button, .btn-bordo { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--bordo); color:var(--dourado); font-weight:700; padding:13px 22px; border-radius:14px; }
  .esqueleto { aspect-ratio:3/4.6; border-radius:var(--raio); background:linear-gradient(100deg,#eee6df 30%,#f6f0ea 50%,#eee6df 70%); background-size:200% 100%; animation:brilho 1.3s infinite; }
  @keyframes brilho { to { background-position:-200% 0; } }

  /* Barra da sacola */
  .barra-sacola { position:fixed; left:0; right:0; bottom:0; z-index:40; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(0deg,var(--bg) 60%,rgba(248,245,242,0)); pointer-events:none; }
  .barra-sacola button { pointer-events:auto; width:100%; max-width:520px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; background:var(--bordo); color:var(--dourado); padding:15px 18px; border-radius:16px; font-weight:800; box-shadow:0 8px 24px rgba(74,21,27,.35); }
  .barra-sacola .qtd { background:var(--dourado); color:var(--bordo); border-radius:999px; min-width:24px; height:24px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center; font-size:.85rem; margin-right:10px; }
  .barra-sacola .esq { display:flex; align-items:center; }

  /* Folhas (modais) */
  .fundo { position:fixed; inset:0; z-index:60; background:rgba(30,10,12,.55); display:none; }
  .fundo.aberto { display:block; }
  .folha { position:fixed; z-index:70; left:0; right:0; bottom:0; top:0; background:var(--bg); display:none; flex-direction:column; }
  .folha.aberta { display:flex; }
  @media (min-width:800px) { .folha { left:50%; top:4vh; bottom:4vh; right:auto; width:min(980px,94vw); transform:translateX(-50%); border-radius:22px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.35); } }
  .folha-topo { display:flex; align-items:center; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; background:#fff; border-bottom:1px solid var(--linha); }
  .folha-topo h2 { margin:0; font-size:1.05rem; color:var(--bordo); }
  .fechar { width:40px; height:40px; border-radius:50%; background:#f1e9e3; font-size:1.4rem; line-height:1; color:var(--bordo); }
  .folha-corpo { overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; }
  .folha-rodape { padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--linha); }

  .prod { display:grid; gap:0; }
  @media (min-width:800px) { .prod { grid-template-columns:1fr 1fr; } }
  .carrossel { position:relative; background:#efe6e0; }
  .faixa { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .faixa::-webkit-scrollbar { display:none; }
  .faixa .slide { flex:none; width:100%; scroll-snap-align:center; aspect-ratio:3/4; max-height:70vh; background:#efe6e0; }
  .faixa .slide img { width:100%; height:100%; object-fit:cover; }
  .pontos { position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:6px; }
  .ponto { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.6); }
  .ponto.ativo { background:#fff; width:18px; border-radius:6px; }
  .seta { position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.85); color:var(--bordo); font-size:1.2rem; display:none; }
  @media (hover:hover) { .seta { display:block; } }
  .seta.e { left:8px; } .seta.d { right:8px; }
  .prod-info { padding:16px 16px 20px; }
  .prod-info h1 { font-size:1.2rem; margin:0 0 6px; color:var(--ink); line-height:1.25; }
  .prod-preco { font-size:1.5rem; font-weight:800; color:var(--bordo); margin-bottom:14px; }
  .sec { margin-top:16px; }
  .sec-t { font-size:.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .sec-t a, .sec-t button.lnk { color:var(--bordo); text-transform:none; letter-spacing:0; font-size:.85rem; text-decoration:underline; font-weight:600; }
  .opcoes { display:flex; flex-wrap:wrap; gap:8px; }
  .op { min-width:46px; padding:10px 14px; border-radius:12px; border:1.5px solid var(--linha); background:#fff; font-weight:700; color:var(--bordo); text-align:center; }
  .op.sel { background:var(--bordo); color:var(--dourado); border-color:var(--bordo); }
  .op.esgotado { color:#b8aaa6; text-decoration:line-through; background:#f6f1ed; cursor:not-allowed; }
  .op-cor { display:flex; align-items:center; gap:8px; padding:8px 14px 8px 10px; }
  .op-cor .bolinha { width:18px; height:18px; }
  .aviso-estoque { font-size:.85rem; color:#a35a00; margin-top:8px; }
  .qtd-box { display:inline-flex; align-items:center; border:1.5px solid var(--linha); border-radius:12px; background:#fff; }
  .qtd-box button { width:42px; height:42px; font-size:1.3rem; color:var(--bordo); }
  .qtd-box span { min-width:34px; text-align:center; font-weight:700; }
  .btn-add { width:100%; background:var(--bordo); color:var(--dourado); padding:16px; border-radius:14px; font-weight:800; font-size:1.02rem; box-shadow:0 6px 18px rgba(74,21,27,.3); }
  .btn-add:disabled { opacity:.45; box-shadow:none; }

  /* Sacola */
  .item { display:flex; gap:12px; padding:12px 14px; background:#fff; border-radius:14px; margin:10px 14px; box-shadow:var(--sombra); }
  .item .mini { width:72px; height:96px; border-radius:10px; background:#efe6e0; overflow:hidden; flex:none; }
  .item .mini img { width:100%; height:100%; object-fit:cover; }
  .item .dados { flex:1; min-width:0; }
  .item .dados .n { font-weight:600; line-height:1.25; }
  .item .dados .d { color:var(--muted); font-size:.85rem; margin:2px 0 6px; }
  .item .linha-b { display:flex; justify-content:space-between; align-items:center; }
  .item .linha-b .p { font-weight:800; color:var(--bordo); }
  .remover { color:var(--muted); font-size:.8rem; text-decoration:underline; margin-top:6px; }
  .form-sacola { padding:6px 14px 14px; }
  .form-sacola label { display:block; font-size:.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:12px 0 6px; }
  .form-sacola input, .form-sacola textarea { width:100%; padding:13px 14px; border:1.5px solid var(--linha); border-radius:12px; font-size:16px; font-family:inherit; background:#fff; outline:none; }
  .aviso-box { margin:10px 14px; padding:10px 12px; background:#fff8e6; border:1px solid var(--dourado); border-radius:12px; font-size:.88rem; color:#6b4a14; }
  .total-linha { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .total-linha .v { font-size:1.4rem; font-weight:800; color:var(--bordo); }
  .btn-zap { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--verde); color:#fff; padding:16px; border-radius:14px; font-weight:800; font-size:1.02rem; box-shadow:0 6px 18px rgba(31,157,85,.35); }
  .btn-zap:disabled { opacity:.5; }
  .nota { font-size:.78rem; color:var(--muted); text-align:center; margin-top:8px; }
  .toast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:#2b1a1c; color:#fff; padding:11px 18px; border-radius:999px; font-size:.9rem; z-index:90; opacity:0; transition:.25s; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.mostra { opacity:1; transform:translateX(-50%) translateY(0); }
  table.medidas { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; }
  table.medidas th, table.medidas td { padding:10px 8px; text-align:center; border-bottom:1px solid var(--linha); font-size:.9rem; }
  table.medidas th { background:var(--bordo); color:var(--dourado); }

  .bloco { background:#fff; border-radius:14px; margin:10px 14px; padding:14px; box-shadow:var(--sombra); }
  .bloco h3 { margin:0 0 4px; font-size:1rem; color:var(--bordo); }
  .bloco .sub { color:var(--muted); font-size:.85rem; margin-bottom:10px; }
  .duas { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .escolha { padding:12px 10px; border-radius:12px; border:1.5px solid var(--linha); background:#fff; font-weight:700; color:var(--bordo); text-align:center; }
  .escolha.sel { background:var(--bordo); color:var(--dourado); border-color:var(--bordo); }
  .opcao-ent { display:block; width:100%; text-align:left; padding:12px 14px; border-radius:12px; border:1.5px solid var(--linha); background:#fff; margin-top:8px; }
  .opcao-ent.sel { border-color:var(--bordo); background:#fbf3ef; }
  .opcao-ent .t { font-weight:700; color:var(--bordo); display:flex; justify-content:space-between; gap:8px; }
  .opcao-ent .d { font-size:.85rem; color:var(--muted); margin-top:3px; }
  .opcao-ent[disabled] { opacity:.5; }
  .campo { margin-top:10px; }
  .campo label { display:block; font-size:.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; }
  .campo input, .campo textarea { width:100%; padding:12px 13px; border:1.5px solid var(--linha); border-radius:12px; font-size:16px; font-family:inherit; background:#fff; outline:none; }
  .campo input:focus, .campo textarea:focus { border-color:var(--bordo); }
  .linha-campos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .convite { background:linear-gradient(160deg,#fff8e6,#fff1d6); border:1px solid var(--dourado); border-radius:14px; padding:14px; margin-top:10px; }
  .convite b { color:var(--bordo); }
  .convite ul { margin:8px 0 0 18px; padding:0; color:#5a4310; font-size:.9rem; }
  .btn-sec { display:inline-flex; align-items:center; justify-content:center; width:100%; padding:13px; border-radius:12px; font-weight:700; margin-top:10px; background:var(--bordo); color:var(--dourado); }
  .btn-sec.claro { background:#fff; color:var(--bordo); border:1.5px solid var(--linha); }
  .msg-ok { background:#e8f6ee; color:#116b3a; border-radius:12px; padding:10px 12px; margin-top:10px; font-size:.9rem; }
  .msg-no { background:#fdeceb; color:#8a1f17; border-radius:12px; padding:10px 12px; margin-top:10px; font-size:.9rem; }
  .msg-info { background:#f3eee9; color:#5b4a4d; border-radius:12px; padding:10px 12px; margin-top:10px; font-size:.88rem; }
  .resumo { padding:4px 0; }
  .resumo .l { display:flex; justify-content:space-between; font-size:.92rem; padding:3px 0; color:var(--ink); }
  .resumo .l.d { color:#116b3a; }
  .sucesso { text-align:center; padding:30px 20px; }
  .sucesso .ok { width:68px; height:68px; border-radius:50%; background:var(--bordo); color:var(--dourado); display:inline-flex; align-items:center; justify-content:center; font-size:2rem; }
  a.btn-zap { text-decoration:none; }
  footer { text-align:center; color:var(--muted); font-size:.78rem; padding:6px 20px 26px; }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>

<header class="topo">
  <div class="topo-linha"><img src="logo.png" alt="USE ELLBA"><span class="marca">USE ELLBA</span></div>
</header>

<div class="barra-busca">
  <div class="campo-busca">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="busca" type="search" placeholder="Buscar peça (ex.: vestido, azul)" autocomplete="off" aria-label="Buscar peça">
  </div>
</div>
<nav class="pilulas" id="pil-cat" aria-label="Categorias"></nav>
<div class="rotulo-linha oculto" id="rot-tam">Tamanho</div>
<nav class="pilulas oculto" id="pil-tam" aria-label="Tamanhos" style="padding-top:6px"></nav>

<div class="contagem" id="contagem"></div>
<main class="grade" id="grade"></main>
<div id="msg-vazio" class="vazio oculto">Nenhuma peça encontrada.<br>Tente outra busca ou limpe os filtros.</div>
<div id="msg-erro" class="erro oculto">Não consegui carregar o catálogo agora.<br><br><button onclick="carregarCatalogo(true)">Tentar de novo</button></div>
<footer>USE ELLBA &middot; Moda feminina</footer>

<!-- Barra da sacola -->
<div class="barra-sacola oculto" id="barra-sacola">
  <button onclick="abrirSacola()" aria-label="Abrir sacola">
    <span class="esq"><span class="qtd" id="sac-qtd">0</span> Ver minha sacola</span>
    <span id="sac-total">R$ 0,00</span>
  </button>
</div>

<div class="fundo" id="fundo" onclick="fecharTudo()"></div>

<!-- Produto -->
<section class="folha" id="folha-produto" role="dialog" aria-modal="true" aria-label="Detalhe da peça">
  <div class="folha-topo"><h2 id="p-topo">Peça</h2><button class="fechar" onclick="fecharTudo()" aria-label="Fechar">&times;</button></div>
  <div class="folha-corpo"><div class="prod" id="p-corpo"></div></div>
  <div class="folha-rodape"><button class="btn-add" id="p-add" onclick="adicionarDaPeca()">Adicionar à sacola</button></div>
</section>

<!-- Sacola -->
<section class="folha" id="folha-sacola" role="dialog" aria-modal="true" aria-label="Sacola">
  <div class="folha-topo"><h2>Minha sacola</h2><button class="fechar" onclick="fecharTudo()" aria-label="Fechar">&times;</button></div>
  <div class="folha-corpo" id="s-corpo"></div>
  <div class="folha-rodape" id="s-rodape"></div>
</section>

<!-- Guia de medidas -->
<section class="folha" id="folha-medidas" role="dialog" aria-modal="true" aria-label="Guia de medidas" style="z-index:80">
  <div class="folha-topo"><h2>Guia de medidas</h2><button class="fechar" onclick="fecharMedidas()" aria-label="Fechar">&times;</button></div>
  <div class="folha-corpo" style="padding:16px" id="m-corpo"></div>
</section>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function() {
  'use strict';
  const CHAVE_SACOLA = 'ellba_sacola_v1', CHAVE_CUPOM = 'ellba_cupom_v1', CHAVE_DADOS = 'ellba_dados_v1', CHAVE_IDENT = 'ellba_ident_v1';
  const ORDEM_TAM = ['PP','P','M','G','GG','XG','XGG','EG','EGG','UNICO','UNICA','U'];
  let produtos = [], familias = [], porId = {};
  let catAtiva = 'Todas', tamAtivo = '', termo = '';
  let sacola = [];            // [{id, qtd}]
  let cupom = '';
  let pecaAtual = null;       // {fam, cor, itemId, qtd}
  let ultimaCarga = 0;
  let cfg = { cashbackPercentual: 0.05, cashbackDias: 40, primeiraCompraPercentual: 0.05, reservaHoras: 24, lojas: {}, cidadeUber: 'Rio de Janeiro', freteCorreios: false };

  // ---------- util ----------
  const $ = id => document.getElementById(id);
  const norm = t => (t || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const brl = n => 'R$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = t => (t == null ? '' : String(t)).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  function ler(chave, padrao) { try { const v = localStorage.getItem(chave); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }
  function gravar(chave, v) { try { localStorage.setItem(chave, JSON.stringify(v)); } catch (e) {} }
  function thumb(u) { return (u && u.indexOf('res.cloudinary.com') > -1) ? u.replace('/upload/q_auto,w_700/', '/upload/q_auto,f_auto,w_420/').replace('/upload/q_auto,', '/upload/q_auto,f_auto,') : u; }

    if (ent.tipo === 'correios' && ent.endereco) { ent.freteSel = null; calcularFrete(); }
  });
  const ZAP = 'M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z';

  async function enviarPedido() {
    if (enviando) return;
    const falta = faltaAlgo(); if (falta) { toast(falta); return; }
    const av = revalidarSacola(); atualizarBarra();
    if (av.length) { desenharSacola(); return; }
    enviando = true; desenharResumo();
    const obs = ($('s-obs') || {}).value || '';
    const lojaPref = lojaOrigem();
    const endereco = ent.tipo === 'correios' ? ent.endereco + ' | Nº ' + ent.numero + (ent.compl ? ' ' + ent.compl : '') : (ent.tipo === 'uber' ? ent.endereco : '');
    try {
      const r = await postApi('registrarPedidoCatalogo', {
        itens: sacola.map(s => ({ id: s.id, qtd: s.qtd, loja: lojaPref })), loja: lojaPref,
        telefone: ident.modo === 'cadastrada' ? ident.telefone : '', nome: ident.nome || '', entrega: ent.tipo,
        cep: ent.cep, endereco: endereco, servico: ent.freteSel ? ent.freteSel.nome : '', frete: freteAtual(), prazo: ent.freteSel ? ent.freteSel.prazo : '',
        cupom: cupom, obs: obs
      });
      mostrarSucesso(r, obs);
      sacola = []; gravar(CHAVE_SACOLA, sacola); atualizarBarra();
      carregarCatalogo(true);
    } catch (err) {
      enviando = false; desenharResumo();
      toast(err.message || 'Não consegui enviar o pedido.');
      if (/dispon|esgot|estoque|sacola/i.test(err.message || '')) { try { produtos = await pegarCatalogo(true); montarFamilias(); revalidarSacola(); atualizarBarra(); desenharSacola(); } catch (e) {} }
    }
    enviando = false;
  }
  function mostrarSucesso(r, obs) {
    const ehCad = ident.modo === 'cadastrada';
    let msg = 'Olá! Acabei de fazer o pedido *' + r.pedidoId + '* pelo catálogo da USE ELLBA 💛\n';
    msg += '\n*Cliente:* ' + (r.cliente ? r.cliente.nome : (ident.nome || 'sem nome')) + (ehCad ? ' (cadastrada)' : ' (sem cadastro)') + '\n';
    msg += '\n*Peças:*\n';
    r.itens.forEach((p, i) => { msg += (i + 1) + ') ' + p.descricao + ' | ' + [p.cor && 'Cor ' + p.cor, p.tamanho && 'Tam. ' + p.tamanho].filter(Boolean).join(' | ') + ' | ' + p.qtd + 'x ' + brl(p.preco) + ' (cód. ' + p.id + ')\n'; });
    msg += '\n*Total das peças:* ' + brl(r.total) + '\n';
    if (ehCad && ident.primeiraCompra && !ident.aniversario) msg += '*Tenho direito ao desconto de 1ª compra* (' + Math.round((cfg.primeiraCompraPercentual || 0.05) * 100) + '%)\n';
    if (ent.tipo === 'retirada') msg += '\n*Entrega:* Retirar na ' + r.loja + '\n';
    else if (ent.tipo === 'uber') msg += '\n*Entrega:* Uber Entrega (eu mesma peço o Uber), buscando na ' + r.loja + '\n*CEP:* ' + maskCep(ent.cep) + ' (' + ent.endereco + ')\n';
    else if (ent.tipo === 'correios') msg += '\n*Entrega:* Correios (' + (ent.freteSel ? ent.freteSel.nome + ' ' + brl(ent.freteSel.preco) + (ent.freteSel.prazo ? ', ' + ent.freteSel.prazo + ' dias úteis' : '') : '') + ')\n*Endereço:* ' + ent.endereco + ', nº ' + ent.numero + (ent.compl ? ' ' + ent.compl : '') + ' - CEP ' + maskCep(ent.cep) + '\n';
    if (r.mistoLojas) msg += '_(peças em lojas diferentes)_\n';
    if (obs.trim()) msg += '\n*Observações:* ' + obs.trim() + '\n';
    if (cupom) msg += '\n*Origem/cupom:* ' + cupom + '\n';
    const url = 'https://wa.me/' + WHATSAPP_LOJA + '?text=' + encodeURIComponent(msg);
    $('s-rodape').innerHTML = '';
    $('s-corpo').innerHTML = '<div class="sucesso"><div class="ok">&#10003;</div><h2 style="color:var(--bordo);margin:14px 0 6px">Pedido ' + esc(r.pedidoId) + ' registrado!</h2><p style="color:var(--muted);margin:0 0 4px">Suas peças ficam reservadas por <b>' + r.reservaHoras + ' horas</b>.</p><p style="color:var(--muted);margin:0 0 18px">Falta só um passo: toque no botão abaixo para enviar o pedido para a vendedora no WhatsApp e combinar o pagamento.</p><a class="btn-zap" href="' + esc(url) + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="' + ZAP + '"/></svg> Continuar no WhatsApp</a><button class="btn-sec claro" onclick="fecharTudo()" style="margin-top:14px">Voltar ao catálogo</button></div>';
  }

  // ---------- link direto ----------
  function abrirPorLink() {
    if (abrirPorLink._feito) return; abrirPorLink._feito = true;
    const q = new URLSearchParams(location.search);
    const cp = (q.get('cupom') || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 30);
    if (cp) { cupom = cp; gravar(CHAVE_CUPOM, cp); }
    const fid = (q.get('familia') || '').trim().toUpperCase().replace(/\s+/g, '');
    if (fid) {
      const f = familias.find(x => x.id.toUpperCase() === fid) || (function() { const it = produtos.find(p => p.id.toUpperCase() === fid); return it ? familias.find(x => x.id === it.familia) : null; })();
      if (f) abrirPeca(f.id); else toast('Essa peça não está mais disponível');
    }
    const pid = (q.get('produto') || '').trim().toUpperCase().replace(/\s+/g, '');
    if (pid) {
      const it = porId[pid] || produtos.find(p => p.id.toUpperCase() === pid);
      if (it) { const f = familias.find(x => x.id === it.familia); if (f) { const cor = f.listaCores.find(c => c.tams.some(t => t.id === it.id)); abrirPeca(f.id, cor, it.saldo > 0 ? it.id : ''); } }
      else { toast('Essa peça não está mais disponível'); }
    }
  }

  // ---------- início ----------
  sacola = ler(CHAVE_SACOLA, []); if (!Array.isArray(sacola)) sacola = [];
  cupom = ler(CHAVE_CUPOM, '') || '';
  (function() { const q = new URLSearchParams(location.search); const cp = (q.get('cupom') || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 30); if (cp) { cupom = cp; gravar(CHAVE_CUPOM, cp); } })();
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('folha-medidas').classList.contains('aberta')) fecharMedidas(); else fecharTudo(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - ultimaCarga > 120000) carregarCatalogo(true); });
  window.carregarCatalogo = carregarCatalogo;
  carregarCatalogo(false);
})();
</script>
